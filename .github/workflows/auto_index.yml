name: Auto Update Digital Garden Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.md'
      - '!index.md'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Index Generator
        run: |
          python update_index.py

      - name: Commit and Push if Indices Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md index_EN.md
          if git diff --staged --quiet; then
            echo "No changes in index files"
          else
            git commit -m "docs: auto-update bilingual index catalogs [skip ci]"
            git push
          fi
